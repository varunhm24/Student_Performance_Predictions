
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Performance Prediction</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 30px 15px;
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            color: #1e293b;
        }

        .container {
            max-width: 650px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
        }

        h1 {
            text-align: center;
            color: #1d4ed8;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #64748b;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 7px;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 16px;
        }

        input:focus {
            outline: 2px solid #93c5fd;
            border-color: #2563eb;
        }

        button {
            width: 100%;
            padding: 14px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        .result {
            margin-top: 25px;
            padding: 18px;
            border-radius: 8px;
            text-align: center;
        }

        .pass {
            background: #dcfce7;
            color: #166534;
        }

        .fail {
            background: #fee2e2;
            color: #991b1b;
        }

        .error {
            margin-top: 20px;
            padding: 12px;
            background: #ffedd5;
            color: #9a3412;
            border-radius: 6px;
        }

        .footer {
            text-align: center;
            margin-top: 25px;
            color: #64748b;
            font-size: 13px;
        }
    </style>
</head>

<body>

    <div class="container">


<div style="display: flex; justify-content: center; gap: 15px; flex-wrap: wrap; margin-bottom: 25px;">

    <a href="/dashboard"
       style="background: #1d4ed8; color: white; padding: 12px 20px; text-decoration: none; border-radius: 6px;">
        Dashboard
    </a>

    <a href="/history"
       style="background: #16a34a; color: white; padding: 12px 20px; text-decoration: none; border-radius: 6px;">
        Prediction History
    </a>

</div>


        <h1>Student Performance Prediction</h1>

        <p class="subtitle">
            Enter academic details to predict student performance.
        </p>

        <form method="POST">
            <div class="form-group">
    <label>Student ID</label>
    <input
        type="text"
        name="student_id"
        required
        placeholder="Example: STU001">
</div>

            <div class="form-group">
                <label>Study Hours Per Day</label>
                <input
                    type="number"
                    name="study_hours"
                    min="0"
                    max="24"
                    step="0.1"
                    required
                    placeholder="Example: 5.5">
            </div>

            <div class="form-group">
                <label>Attendance (%)</label>
                <input
                    type="number"
                    name="attendance"
                    min="0"
                    max="100"
                    step="0.1"
                    required
                    placeholder="Example: 85">
            </div>

            <div class="form-group">
                <label>Previous Marks (%)</label>
                <input
                    type="number"
                    name="previous_marks"
                    min="0"
                    max="100"
                    step="0.1"
                    required
                    placeholder="Example: 75">
            </div>

            <div class="form-group">
                <label>Assignments Completed (out of 20)</label>
                <input
                    type="number"
                    name="assignments"
                    min="0"
                    max="20"
                    step="1"
                    required
                    placeholder="Example: 15">
            </div>

            <div class="form-group">
                <label>Internal Marks (%)</label>
                <input
                    type="number"
                    name="internal_marks"
                    min="0"
                    max="100"
                    step="0.1"
                    required
                    placeholder="Example: 70">
            </div>

            <button type="submit">
                Predict Student Performance
            </button>

        </form>

        {% if prediction %}
            <div class="result {{ 'pass' if prediction == 'Pass' else 'fail' }}">
                <h2>Prediction: {{ prediction }}</h2>
                <p>{{ message }}</p>
            </div>
        {% elif message %}
            <div class="error">
                {{ message }}
            </div>
        {% endif %}

        <div class="footer">
            Student Performance Prediction System using Machine Learning
        </div>

    </div>

</body>
</html>
